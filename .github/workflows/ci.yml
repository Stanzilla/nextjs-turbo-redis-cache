name: CI

on:
  push:
    branches:
      - main
      - faceit
  pull_request:
    branches:
      - main
      - faceit

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run lint
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Install Next.js 16.3 fixture for contract unit tests
        run: cd test/nextjs-test-projects/next-app-16-3-0 && pnpm install --ignore-scripts

      - name: Install Next.js 16.4 fixture for contract unit tests
        run: cd test/nextjs-test-projects/next-app-16-4-2 && pnpm install --ignore-scripts

      - name: Run unit tests
        run: pnpm test:unit:coverage

      - name: Code Coverage Comments
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: kcjpop/coverage-comments@v2.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: './coverage/lcov.info'

      - name: Dry run the release
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --dry-run

  unit-redis-v4:
    name: unit tests (redis 4.7.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Install redis 4.7.0
        run: pnpm add -D redis@4.7.0 --ignore-scripts

      - name: Install Next.js 16.3 fixture for contract unit tests
        run: cd test/nextjs-test-projects/next-app-16-3-0 && pnpm install --ignore-scripts

      - name: Run unit tests
        run: pnpm test:unit

  redis-scripts:
    name: Lua scripts on Redis (redis ${{ matrix.redis-client }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis-client:
          - 'from lockfile'
          - '4.7.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Install redis ${{ matrix.redis-client }}
        if: matrix.redis-client != 'from lockfile'
        run: pnpm add -D redis@${{ matrix.redis-client }} --ignore-scripts

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Run Lua script tests
        run: pnpm test:integration:redis-scripts

  redis-cluster:
    name: Lua scripts and tag invalidation on cluster-mode Valkey
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # One node that owns all slots, like ElastiCache Serverless.
      - name: Start cluster-mode Valkey
        run: |
          docker run -d --name valkey -p 6380:6379 valkey/valkey:9.0 \
            valkey-server --cluster-enabled yes \
            --cluster-config-file /tmp/nodes.conf \
            --notify-keyspace-events Exe --save '' --appendonly no \
            --protected-mode no --bind 0.0.0.0
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli ping | grep -q PONG && break
            sleep 1
          done
          docker exec valkey valkey-cli CLUSTER ADDSLOTSRANGE 0 16383
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli CLUSTER INFO | grep -q 'cluster_state:ok' && exit 0
            sleep 1
          done
          docker exec valkey valkey-cli CLUSTER INFO
          exit 1

      - name: Run cluster tests
        run: pnpm test:integration:cluster
        env:
          REDIS_URL: redis://127.0.0.1:6380
          REQUIRE_CLUSTER: '1'

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      matrix:
        next-test-app:
          - next-app-15-4-11
          - next-app-16-0-11
          - next-app-16-2-6
          - next-app-16-3-0
          - next-app-16-4-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Install test project
        run: cd test/nextjs-test-projects/${{ matrix.next-test-app }} && pnpm install

      - name: Build test project
        run: cd test/nextjs-test-projects/${{ matrix.next-test-app }} && pnpm build

      - name: Run integration tests
        run: pnpm test:integration
        env:
          SKIP_BUILD: true
          NEXT_TEST_APP: ${{ matrix.next-test-app }}

  integration-pages:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      matrix:
        pages-test-app:
          - next-pages-16-2-6
          - next-pages-16-3-0
          - next-pages-16-4-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Install test project
        run: cd test/nextjs-test-projects/${{ matrix.pages-test-app }} && pnpm install

      - name: Build test project
        run: cd test/nextjs-test-projects/${{ matrix.pages-test-app }} && pnpm build

      - name: Run Pages Router integration tests
        run: pnpm test:integration:pages
        env:
          SKIP_BUILD: true
          NEXT_PAGES_TEST_APP: ${{ matrix.pages-test-app }}

  integration-build-id-prefix:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Install test project
        run: cd test/nextjs-test-projects/next-app-15-4-11 && pnpm install

      - name: Build test project
        run: cd test/nextjs-test-projects/next-app-15-4-11 && pnpm build

      - name: Run BUILD_ID prefix integration test
        run: pnpm test:integration:build-id-prefix

  integration-cache-components:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      matrix:
        cache-components-app:
          - next-app-16-0-11-cache-components
          - next-app-16-2-6-cache-components
          - next-app-16-3-0-cache-components
          - next-app-16-4-2-cache-components
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Install test project
        run: cd test/nextjs-test-projects/${{ matrix.cache-components-app }} && pnpm install

      - name: Build test project
        run: cd test/nextjs-test-projects/${{ matrix.cache-components-app }} && pnpm build

      - name: Run cache-components integration tests
        run: pnpm test:integration:cache-components
        env:
          CACHE_COMPONENTS_APP: ${{ matrix.cache-components-app }}

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      matrix:
        cache-components-app:
          - next-app-16-0-11-cache-components
          - next-app-16-2-6-cache-components
          - next-app-16-3-0-cache-components
          - next-app-16-4-2-cache-components
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Setup Redis
        uses: ./.github/actions/setup-redis

      - name: Install test project
        run: cd test/nextjs-test-projects/${{ matrix.cache-components-app }} && pnpm install

      - name: Build test project
        run: cd test/nextjs-test-projects/${{ matrix.cache-components-app }} && pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_TEST_APP: ${{ matrix.cache-components-app }}
